<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 150" width="430" height="150" role="img" aria-label="Metheus Extension">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080d"/><stop offset="1" stop-color="#0b1626"/></linearGradient>
    <style>
      text { font-family: "Segoe UI","Helvetica Neue",Arial,sans-serif; }
      .mono { font-family: ui-monospace,"Cascadia Code",Consolas,monospace; }
      @keyframes pulse { 0%,100% { r: 4; opacity: 1; } 50% { r: 7; opacity: .35; } }
      @keyframes slide { from { transform: translateX(-120px); } to { transform: translateX(520px); } }
      .p { animation: pulse 2s ease-in-out infinite; }
      .s { animation: slide 5s linear infinite; }
    </style>
    <clipPath id="c"><rect width="430" height="150" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="430" height="150" fill="url(#g)"/>
    <rect class="s" x="0" y="0" width="90" height="2" fill="#22d3ee" fill-opacity=".8"/>
    <rect x=".5" y=".5" width="429" height="149" rx="15.5" fill="none" stroke="#1d2b3d"/>
    <circle class="p" cx="30" cy="34" r="4" fill="#22d3ee"/>
    <text class="mono" x="46" y="38" font-size="11" fill="#6b8299" letter-spacing="1.5">EXTENSIÓN · CHROME · FIREFOX · EDGE</text>
    <text x="24" y="76" font-size="26" font-weight="800" fill="#fff">Metheus Extension</text>
    <text x="24" y="102" font-size="14" fill="#9fb2c7">Subtítulos con clic y diccionario en Netflix,</text>
    <text x="24" y="122" font-size="14" fill="#9fb2c7">YouTube y más. 100% gratis.</text>
    <text class="mono" x="24" y="141" font-size="12" fill="#22d3ee">metheus.app/extension  →</text>
  </g>
</svg>
