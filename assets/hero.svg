<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d">
  <title id="t">Isaac (GisaacPr) construye Metheus</title>
  <desc id="d">Subtítulos dobles animados: cada palabra se resalta y un diccionario muestra su significado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04070b"/><stop offset="1" stop-color="#0a1422"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".30"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="880" height="330" rx="20"/></clipPath>
    <style>
      text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
      @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(90px,24px); } }
      @keyframes hl { 0%,15% { fill: #22d3ee; } 18%,100% { fill: #ffffff; } }
      @keyframes pop { 0%,15% { opacity: 1; } 18%,100% { opacity: 0; } }
      @keyframes bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
      .glow { animation: drift 14s ease-in-out infinite; }
      .w { fill: #fff; animation: hl 10s linear infinite; }
      .m { opacity: 0; animation: pop 10s linear infinite; }
      .bar { transform-box: fill-box; transform-origin: left; animation: bar 10s linear infinite; }
      .dot { animation: blink 1.6s ease-in-out infinite; }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="880" height="330" fill="url(#bg)"/>
    <circle class="glow" cx="170" cy="70" r="230" fill="url(#glow)"/>
    <rect x=".5" y=".5" width="879" height="329" rx="19.5" fill="none" stroke="#1d2b3d"/>

    <circle class="dot" cx="40" cy="42" r="5" fill="#22d3ee"/>
    <text class="mono" x="54" y="46" font-size="13" fill="#6b8299" letter-spacing="1.5">metheus.app</text>

    <text x="36" y="112" font-size="50" font-weight="800" fill="#fff">Isaac<tspan fill="#22d3ee" font-weight="600" font-size="26" dx="12">/GisaacPr</tspan></text>
    <text x="36" y="148" font-size="19" fill="#9fb2c7">Construyo Metheus: aprender idiomas con lo que ya mirás.</text>

    <!-- barra de subtítulos -->
    <rect x="36" y="188" width="808" height="104" rx="14" fill="#000" fill-opacity=".62" stroke="#1d2b3d"/>
    <text x="64" y="232" font-size="26" font-weight="700">
      <tspan class="w" style="animation-delay:0s">Aprendé</tspan>
      <tspan class="w" style="animation-delay:2s" dx="9">inglés</tspan>
      <tspan class="w" style="animation-delay:4s" dx="9">mirando</tspan>
      <tspan class="w" style="animation-delay:6s" dx="9">lo que</tspan>
      <tspan class="w" style="animation-delay:8s" dx="9">te gusta</tspan>
    </text>
    <text x="64" y="266" font-size="17" fill="#7d92a8">Learn English by watching what you already like.</text>

    <!-- diccionario: una entrada por palabra, sincronizada -->
    <g transform="translate(630,200)">
      <rect width="214" height="80" rx="10" fill="#0b1524" stroke="#22d3ee" stroke-opacity=".45"/>
      <text class="mono" x="14" y="22" font-size="11" fill="#22d3ee" letter-spacing="1.5">DICCIONARIO</text>
      <g class="m" style="animation-delay:0s"><text x="14" y="52" font-size="21" font-weight="700" fill="#fff">Aprendé</text><text class="mono" x="14" y="70" font-size="12" fill="#8aa0b6">learn · verbo</text></g>
      <g class="m" style="animation-delay:2s"><text x="14" y="52" font-size="21" font-weight="700" fill="#fff">inglés</text><text class="mono" x="14" y="70" font-size="12" fill="#8aa0b6">English · idioma</text></g>
      <g class="m" style="animation-delay:4s"><text x="14" y="52" font-size="21" font-weight="700" fill="#fff">mirando</text><text class="mono" x="14" y="70" font-size="12" fill="#8aa0b6">watching · gerundio</text></g>
      <g class="m" style="animation-delay:6s"><text x="14" y="52" font-size="21" font-weight="700" fill="#fff">lo que</text><text class="mono" x="14" y="70" font-size="12" fill="#8aa0b6">what · pronombre</text></g>
      <g class="m" style="animation-delay:8s"><text x="14" y="52" font-size="21" font-weight="700" fill="#fff">te gusta</text><text class="mono" x="14" y="70" font-size="12" fill="#8aa0b6">you like · verbo</text></g>
    </g>

    <!-- línea de tiempo del video -->
    <rect x="36" y="304" width="808" height="3" rx="1.5" fill="#16222f"/>
    <rect class="bar" x="36" y="304" width="808" height="3" rx="1.5" fill="#22d3ee"/>
  </g>
</svg>
