name: Gusano de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0b1220&color_dots=#ebedf0,#c5ecff,#8CE0FF,#1CB0F6,#0b6fa3
            dist/github-snake-dark.svg?color_snake=#ffffff&color_dots=#161b22,#0c3a55,#0f6a9c,#1CB0F6,#8CE0FF

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
